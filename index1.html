 <title>Imagem com Botão Posicionado</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }

        .container-foto {
            position: relative;
            width: 600px;
            max-width: 90%;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .imagem {
            width: 100%;
            display: block;
        }

        .botao-sobre {
            position: absolute;

            top: 80%;
            left: 50%;
            transform: translate(-50%, -50%);

            padding: 15px 30px;
            background-color: #2ecc71;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .botao-sobre:hover {
            background-color: #27ae60;
            transform: translate(-50%, -50%) scale(1.05);
        }
    </style>
</head>
<body>

    <div class="container-foto">
        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1000&q=80" alt="Paisagem" class="imagem">
        <button class="botao-sobre">Ver Detalhes</button>
    </div>

</body>
